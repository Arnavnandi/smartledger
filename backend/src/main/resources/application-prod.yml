spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:${DATABASE_URL:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartledger_db}}}}
    username: ${SPRING_DATASOURCE_USERNAME:smartledger}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update # Using update for simplicity in MVP, but 'validate' is safer long term.
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:}
  sender-name: ${BREVO_SENDER_NAME:SmartLedger}

jwt:
  secret: ${JWT_SECRET:supersecretkeythatisatleast256bitslong1234567890supersecretkeythatisatleast256bitslong1234567890}
  expiration: 86400000

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

server:
  port: ${PORT:8080}
  error:
    include-message: always

logging:
  level:
    root: INFO
    org.springframework.web: ERROR
    com.smartledger: INFO
